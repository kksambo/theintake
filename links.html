<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Intake | Links</title>
  <meta name="description" content="Find your next job. South Africa and beyond. Links for The Intake." />
  <meta name="theme-color" content="#1a5f7a" />
  <link rel="canonical" href="https://theintake.co.za/links" />
  <link rel="icon" href="logo-icon.png?v=20261114e" type="image/png" />
  <meta property="og:title" content="The Intake | Links" />
  <meta property="og:description" content="Find your next job. South Africa and beyond." />
  <meta property="og:url" content="https://theintake.co.za/links" />
  <meta property="og:image" content="https://theintake.co.za/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1c2e;
      --muted: #5a6b7d;
      --accent: #1a5f7a;
      --accent-hover: #144c62;
      --surface: #ffffff;
      --page: #eef3f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, #c5dde8 0%, transparent 55%),
        linear-gradient(180deg, #dce8ef 0%, var(--page) 40%, #e8eef2 100%);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: min(420px, 100%);
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 8px 28px rgba(15, 28, 46, 0.1);
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .avatar img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    h1 {
      margin: 0 0 0.4rem;
      font-family: "Outfit", system-ui, sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .tagline {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }
    .links {
      display: grid;
      gap: 0.75rem;
    }
    .link {
      display: block;
      padding: 0.95rem 1.1rem;
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.98rem;
      text-decoration: none;
      box-shadow: 0 2px 10px rgba(15, 28, 46, 0.06);
      border: 1px solid rgba(26, 95, 122, 0.12);
      transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease;
    }
    .link:hover,
    .link:focus-visible {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-1px);
      outline: none;
    }
    .link.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .link.primary:hover,
    .link.primary:focus-visible {
      background: var(--accent-hover);
    }
    .foot {
      margin-top: 2.25rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="avatar">
      <img src="logo-icon.png?v=20261114e" alt="The Intake" width="64" height="64" />
    </div>
    <h1>The Intake</h1>
    <p class="tagline">Find your next job. South Africa and beyond.</p>
    <nav class="links" aria-label="Links">
      <a class="link primary" href="https://theintake.co.za/">Browse jobs — theintake.co.za</a>
      <a class="link" href="https://theintake.co.za/cv.html">Build your CV</a>
    </nav>
    <p class="foot">theintake.co.za</p>
  </main>
</body>
</html>
